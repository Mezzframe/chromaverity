# CI: runs on every push and pull request.
# Two jobs: tests (does it work?) and secrets (did anyone commit a key?).
# Actions are pinned to commit SHAs (version in the comment); Dependabot keeps them current.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read          # least privilege: CI only needs to read the code

# A new push to the same branch cancels the run already going for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Make the test suite fail, not skip, if a runner ends up without FFmpeg.
  CHROMAVERITY_REQUIRE_FFMPEG: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20     # the whole job; a hung FFmpeg can't hold a runner for 6 hours
    strategy:
      fail-fast: false
      matrix:
        # Two Ubuntu releases = two FFmpeg versions for free (4.4 and 6.1, measured in the job log).
        # FFmpeg behavior changes between versions (see docs/09-mislabel-zoo.md),
        # so we test the oldest and newest we support, not just one.
        include:
          - os: ubuntu-22.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.13"
          # macOS and Windows: one job each on the newest Python, so docs/install.md
          # can say "tested" instead of "assumed". Their FFmpeg comes from Homebrew
          # and Chocolatey, which track recent releases (9.0.x at the time of writing).
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    defaults:
      run:
        # bash on every OS (Windows runners ship Git Bash), so one set of commands
        # works everywhere. Without this, Windows steps would run in PowerShell.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip                           # reuse downloaded wheels between runs
          cache-dependency-path: pyproject.toml
      # One install step per OS; `if:` picks the right one. runner.os is Linux, macOS or Windows.
      - name: Install FFmpeg (Linux, apt; includes libx264)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install FFmpeg (macOS, Homebrew)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows, Chocolatey)
        if: runner.os == 'Windows'
        # Chocolatey is preinstalled on GitHub's Windows runners; winget isn't reliably.
        # Its community server sometimes times out (504), and choco then exits 0
        # having installed nothing (seen 2026-10-14). So we don't trust the exit
        # code: we retry up to 3 times and check that ffmpeg is really on PATH.
        # `::warning::` / `::error::` are GitHub annotations: they show up on the run page.
        run: |
          for attempt in 1 2 3; do
            choco install ffmpeg -y --no-progress || true
            if command -v ffmpeg >/dev/null; then exit 0; fi
            echo "::warning::FFmpeg not installed (attempt $attempt of 3). Retrying in 30 s."
            sleep 30
          done
          echo "::error::Could not install FFmpeg from Chocolatey after 3 attempts (server down?). Re-run the job later."
          exit 1
      - name: Record tool versions (reproducibility)
        run: ffmpeg -version | head -1 && python --version
      - name: Install chromaverity with dev + mcp extras
        run: pip install -e ".[dev,mcp]"
      - name: Lint (includes bandit-style security rules)
        run: ruff check .
      - name: Test (builds the synthetic zoo, then runs every check end to end)
        # -ra is in pyproject: the summary lists every skip and why. With
        # CHROMAVERITY_REQUIRE_FFMPEG=1 a missing FFmpeg fails instead of skipping.
        run: pytest -v

      # The steps above run in bash on every OS. Windows users mostly use
      # PowerShell or cmd, so on Windows we also run the exact lines from
      # docs/install.md sections 3 and 4 in those shells. If these break, the
      # install guide is wrong. Keep them in step with the doc.
      - name: Follow docs/install.md in PowerShell (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Make a failing program (exit code != 0) stop the step, like `set -e` in bash.
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .venv
          .venv\Scripts\Activate.ps1
          pip install -e ".[dev,mcp]"
          python scripts/make_zoo.py samples
          chromaverity inspect samples/full_pixels_labelled_limited.mp4 --fail-on never
          chromaverity diff samples/good_limited_709.mp4 samples/hop_dropped_tags.mp4
          pytest -q
          # On Windows the proposed fix should be printed PowerShell-quoted.
          $out = chromaverity inspect samples/full_pixels_labelled_limited.mp4 --fail-on never | Out-String
          if ($out -notmatch 'PS> ffmpeg') { Write-Output $out; throw "expected a PowerShell-quoted fix line" }
      - name: Follow docs/install.md in cmd.exe (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        # `call` is needed inside a batch file (which is what this step is);
        # typed at a cmd prompt, plain `.venv\Scripts\activate.bat` is enough.
        # Re-running `python -m venv .venv` on an existing venv is harmless.
        run: |
          python -m venv .venv
          call .venv\Scripts\activate.bat
          pip install -e ".[dev,mcp]"
          chromaverity inspect samples/full_pixels_labelled_limited.mp4 --fail-on never

  build:
    # Can the package actually be built and would PyPI accept it? Catches a
    # missing file in the wheel or a README that won't render, before release day.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Build the wheel and sdist
        run: pip install build twine && python -m build
      - name: Check the metadata PyPI will see
        run: twine check dist/*
      - name: List what went into the wheel (py.typed and every module should be there)
        run: python -c "import glob, zipfile; [print(n) for n in zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()]"

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0     # scan full history, not just the last commit
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Org-owned repos need a (free) GITLEAKS_LICENSE secret; this repo is user-owned, so none yet.
