# CI: runs on every push and pull request.
# Two jobs: tests (does it work?) and secrets (did anyone commit a key?).
# ⟨verify⟩ action major versions before first run; SEC spine "should": pin actions by commit SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read          # least privilege: CI only needs to read the code

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Two Ubuntu releases = two FFmpeg versions for free (4.4 and 6.1 ⟨verify⟩).
        # FFmpeg behavior changes between versions (see docs/09-mislabel-zoo.md),
        # so we test the oldest and newest we support, not just one.
        include:
          - os: ubuntu-22.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.13"
          # macOS and Windows: one job each on the newest Python, so docs/install.md
          # can say "tested" instead of "assumed". Their FFmpeg comes from Homebrew
          # and Chocolatey, which track recent releases ⟨verify versions in the log⟩.
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    defaults:
      run:
        # bash on every OS (Windows runners ship Git Bash), so one set of commands
        # works everywhere. Without this, Windows steps would run in PowerShell.
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # One install step per OS; `if:` picks the right one. runner.os is Linux, macOS or Windows.
      - name: Install FFmpeg (Linux, apt; includes libx264)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install FFmpeg (macOS, Homebrew)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows, Chocolatey)
        if: runner.os == 'Windows'
        # Chocolatey is preinstalled on GitHub's Windows runners; winget isn't reliably.
        run: choco install ffmpeg -y --no-progress
      - name: Record tool versions (reproducibility)
        run: ffmpeg -version | head -1 && python --version
      - name: Install chromaverity with dev + mcp extras
        run: pip install -e ".[dev,mcp]"
      - name: Lint (includes bandit-style security rules)
        run: ruff check .
      - name: Test (builds the synthetic zoo, then runs every check end to end)
        run: pytest -v

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0     # scan full history, not just the last commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Org-owned repos need a (free) GITLEAKS_LICENSE secret ⟨verify⟩; personal repos don't.
