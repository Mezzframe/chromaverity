# Release: when a GitHub release is published, build the package and upload it to PyPI.
#
# No password or API token is stored anywhere. PyPI "Trusted Publishing" checks a
# short-lived identity token that GitHub issues to *this* workflow in *this* repo,
# and only accepts an upload if pypi.org has been told to expect exactly that
# (owner Novapakt, repo chromaverity, workflow release.yml, environment pypi).
# Setup, once, by the maintainer: docs/release.md.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"
      - name: Check the tag matches the package version
        # A release tagged v0.1.0 must build version 0.1.0, or PyPI gets the wrong number forever.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/chromaverity/__init__.py').read_text()).group(1))")
          echo "tag=$tag package=$ver"
          test "$tag" = "$ver"
      - name: Build and check
        run: pip install build twine && python -m build && twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    # Separate job so only the upload step gets the identity token, not the build.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi        # must match the environment name registered on pypi.org
    permissions:
      id-token: write        # lets GitHub mint the token PyPI checks; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
