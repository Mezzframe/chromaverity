# Python packaging config. One file replaces the old setup.py + setup.cfg +
# requirements.txt mix. Read top to bottom: what the package is, what it
# needs, how to build it, then tool settings.

[project]
name = "chromaverity"
version = "0.1.0.dev0"
description = "Check whether a video's color labels match its pixels."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Mezzframe AI" }]
keywords = ["video", "ffmpeg", "color", "broadcast", "qc", "hdr", "mcp"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Topic :: Multimedia :: Video",
  "Programming Language :: Python :: 3",
]
# No runtime dependencies on purpose: stdlib + the ffmpeg/ffprobe binaries.
dependencies = []

[project.optional-dependencies]
# MCP server for AI agents. ⟨verify⟩ 2.x API (MCPServer); pin tighter once tested.
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
# Installing the package puts a `chromaverity` command on your PATH that calls main().
chromaverity = "chromaverity.cli:main"

[project.urls]
Homepage = "https://mezzframe.ai"
# Repository = "https://github.com/<org>/chromaverity"   # fill in when the repo exists

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chromaverity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ffmpeg: needs ffmpeg/ffprobe and libx264 on PATH (generates test clips)"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: errors and pyflakes. I: import order. B: likely bugs. UP: modern syntax.
# S: security (bandit rules): catches shell=True, eval, hard-coded secrets.
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]   # asserts and subprocess are fine in tests
"scripts/*" = ["S603", "S607"]
